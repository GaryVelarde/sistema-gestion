<p-toast key="tst"></p-toast>
<div *ngIf="statusCallUser" class="surface-card shadow-2 border-round p-4">
    <!-- Cover Photo Section -->
    <div class="cover-photo relative mb-4">
        <!-- Avatar Section -->
        <div
            class="flex justify-content-start align-items-center absolute bottom-0 left-0 translate-y-50 ml-4"
        >
            <p-avatar
                label="{{ user.name.charAt(0) }}"
                styleClass="w-8rem h-8rem border-4 border-surface-0 shadow-3 bg-primary mb-4"
                size="xlarge"
            ></p-avatar>
        </div>
    </div>

    <!-- Profile Information Section -->
    <div
        class="flex flex-column md:flex-row md:align-items-center md:justify-content-between mb-1"
    >
        <div class="text-center md:text-left ml-3">
            <h1 *ngIf="!edition" class="text-3xl font-bold text-primary mb-1">
                {{ user.name + " " + user.surnames }}
            </h1>
            <form
                *ngIf="edition"
                [formGroup]="userForm"
                class="grid flex my-2 w-full ml-1"
            >
                <label class="block text-600 font-semibold mb-1">Nombres</label>
                <input
                    type="text"
                    pInputText
                    class="w-full mb-2"
                    formControlName="name"
                />
                <label class="block text-600 font-semibold mb-1"
                    >Apellidos</label
                >
                <input
                    type="text"
                    pInputText
                    class="w-full"
                    formControlName="surnames"
                />
            </form>

            <p class="text-600 font-medium mb-1">{{ "Rol: " + user.role }}</p>
            <p class="text-600">{{ "Código: " + user.code }}</p>
        </div>
        <div class="mt-3 md:mt-0">
            <p-button
                *ngIf="!edition"
                label="Editar perfil"
                icon="pi pi-user-edit"
                styleClass="p-button-rounded p-button-outlined p-button-secondary"
                (click)="showEdition()"
            ></p-button>
            <p-button
                *ngIf="edition"
                class="ml-3"
                styleClass="p-button p-button-outlined p-button-secondary"
                (click)="cancelEdition()"
                label="Cancelar edición"
                icon="pi pi-times"
                iconPos="right"
                [disabled]="statusUpdate !== 'pi pi-save'"
            />
            <p-button
                *ngIf="edition"
                class="ml-3"
                (click)="saveEdition()"
                label="Guardar cambios"
                [icon]="statusUpdate"
                iconPos="left"
                [disabled]="statusUpdate !== 'pi pi-save'"
            />
        </div>
    </div>

    <p-tabView>
        <p-tabPanel header="Información">
            <div *ngIf="!edition" class="grid">
                <div class="col-12 md:col-6">
                    <div class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Email</label
                        >
                        <span class="text-900">{{ user.email }}</span>
                    </div>
                    <div class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Nro celular</label
                        >
                        <span class="text-900">{{ user.phone }}</span>
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Carrera</label
                        >
                        <span class="text-900">{{ user.career }}</span>
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Línea</label
                        >
                        <span class="text-900">{{ user.line }}</span>
                    </div>
                </div>
                <div class="col-12 md:col-6">
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Sublínea</label
                        >
                        <span class="text-900">{{ user.sublines }}</span>
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Orcid</label
                        >
                        <span class="text-900">{{ user.orcid || "-" }}</span>
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Cip</label
                        >
                        <span class="text-900">{{ user.cip || "-" }}</span>
                    </div>
                </div>
            </div>
            <form *ngIf="edition" [formGroup]="userForm" class="grid">
                <div class="col-12 md:col-6">
                    <div class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Email</label
                        >
                        <span class="text-900">{{ user.email }}</span>
                    </div>
                    <div class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Nro celular</label
                        >
                        <input
                            type="text"
                            pInputText
                            class="w-full"
                            formControlName="phone"
                        />
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Carrera</label
                        >
                        <input
                            type="text"
                            pInputText
                            class="w-full"
                            formControlName="career"
                        />
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Línea</label
                        >
                        <input
                            type="text"
                            pInputText
                            class="w-full"
                            formControlName="line"
                        />
                    </div>
                </div>
                <div class="col-12 md:col-6">
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Sublínea</label
                        >
                        <input
                            type="text"
                            pInputText
                            class="w-full"
                            formControlName="sublines"
                        />
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Orcid</label
                        >
                        <input
                            type="text"
                            pInputText
                            class="w-full"
                            formControlName="orcid"
                        />
                    </div>
                    <div *ngIf="user.role === 'Docente'" class="mb-3">
                        <label class="block text-600 font-semibold mb-1"
                            >Cip</label
                        >
                        <input
                            type="text"
                            pInputText
                            class="w-full"
                            formControlName="cip"
                        />
                    </div>
                </div>
            </form>
        </p-tabPanel>
        <p-tabPanel header="Cambio de clave">
            <div class="grid">
                <div class="flex justify-content-center col-12">
                    <form [formGroup]="changePasswordForm">
                        <div class="col-12">
                            <label class="block text-600 font-semibold mb-1"
                                >Contraseña actual</label
                            >
                            <p-password
                                formControlName="oldPassword"
                                [toggleMask]="true"
                                [feedback]="false"
                                class="w-full"
                            />
                        </div>
                        <div class="col-12">
                            <label class="block text-600 font-semibold mb-1"
                                >Nueva contraseña</label
                            >
                            <p-password
                                formControlName="newPassword"
                                [toggleMask]="true"
                                class="w-full"
                            />
                        </div>
                        <div class="col-12">
                            <label class="block text-600 font-semibold mb-1"
                                >Repita su nueva contraseña</label
                            >
                            <p-password
                                formControlName="repeatNewPassword"
                                [toggleMask]="true"
                                [feedback]="false"
                                class="w-full"
                            />
                            <br />
                            <small
                                *ngIf="
                                    repeatNewPassword.hasError(
                                        'passwordMismatch'
                                    )
                                "
                                class="text-error"
                            >
                                Las contraseñas no coinciden.
                            </small>
                        </div>
                        <p-button
                            *ngIf="!edition"
                            label="Actualizar contraseña"
                            [icon]="changePassStatus"
                            styleClass="p-button-rounded p-button-outlined p-button-secondary w-full mt-3"
                            [disabled]="
                                !changePasswordForm.valid ||
                                changePassStatus !== 'pi pi-save'
                            "
                            (click)="resetPassword()"
                        ></p-button>
                    </form>
                </div></div
        ></p-tabPanel>
    </p-tabView>
</div>
